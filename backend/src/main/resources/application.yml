spring:
  application:
    name: bakeaura-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 5000
        debug: false

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

fast2sms:
  api-key: ${FAST2SMS_API_KEY}

app:
  base-url: http://localhost:8080
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  rate-limit:
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  delivery:
    max-radius-km: ${DELIVERY_MAX_RADIUS_KM:10}
    base-time-minutes: 10
    average-speed-kmph: ${DELIVERY_AVERAGE_SPEED_KMPH:30}
    road-distance-factor: ${DELIVERY_ROAD_DISTANCE_FACTOR:1.3}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

# ==========================================
# RESILIENCE4J CIRCUIT BREAKERS
# ==========================================

resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
      cloudinary:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
      gemini:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 2
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
