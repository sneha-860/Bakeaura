
spring:
  application:
    name: bakeaura-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bakeaura_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:hello}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes in milliseconds

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_your_key}
  key-secret: ${RAZORPAY_KEY_SECRET:your_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME_HERE}
  api-key: ${CLOUDINARY_API_KEY:YOUR_API_KEY_HERE}
  api-secret: ${CLOUDINARY_API_SECRET:YOUR_API_SECRET_HERE}


  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}
  delivery:
    max-radius-km: ${DELIVERY_MAX_RADIUS_KM:10}
    base-time-minutes: 10 # Fixed prep time added to travel time
    average-speed-kmph: ${DELIVERY_AVERAGE_SPEED_KMPH:30}
    road-distance-factor: ${DELIVERY_ROAD_DISTANCE_FACTOR:1.3}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:bakeaura_dev_secret_change_me}
  access-expiration: 900000
  refresh-expiration: 604800000
