spring.application.name=bakeaura-backend

# Database connection — replace 'password' with your PostgreSQL password
spring.datasource.url=jdbc:postgresql://localhost:5432/bakeaura_db
spring.datasource.username=postgres
spring.datasource.password=hello
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
# 'update' means: create tables if they don't exist, add columns if missing
# Never use 'create' on production — it deletes all data on restart!

spring.jpa.show-sql=true
# Shows the SQL queries Spring generates — great for learning

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# JWT secret — we'll use this later
jwt.secret=bakeaura_super_secret_key_change_this_in_production_2024
jwt.access-expiration=900000
jwt.refresh-expiration=604800000
