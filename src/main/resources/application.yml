spring:
  application:
    name: bakeaura-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bakeaura_db
    username: postgres
    password: hello
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes in milliseconds

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_your_key}
  key-secret: ${RAZORPAY_KEY_SECRET:your_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:your_api_key}
    max-delivery-radius-km: 10

app:
  delivery:
    base-time-minutes: 10 # Fixed prep time added to travel time

server:
  port: 8080

jwt:
  secret: bakeaura_super_secret_key_change_this_in_production_2024
  access-expiration: 900000
  refresh-expiration: 604800000
