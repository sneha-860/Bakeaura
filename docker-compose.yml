version: '3.8'

services:

  # Your Spring Boot app
  app:
    build: .           # build using Dockerfile in current directory
    ports:
      - "8080:8080"    # host_port:container_port
    environment:
      # Override application.properties values for Docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bakeaura_db
      # Note: use "postgres" (service name below) not "localhost"
      # Inside Docker network, services talk by their service name
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=hello
      - SPRING_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    # Wait for postgres and redis to start before starting the app

  # PostgreSQL database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=bakeaura_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=hello
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Named volume: data persists even when container stops

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Alpine = smaller image size, same functionality

volumes:
  postgres_data:
  # Docker manages this volume on your machine